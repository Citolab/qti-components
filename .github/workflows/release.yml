name: "Manual: release and publish packages (changesets)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Dry-run (no commits, tags, or publishes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Pinned below 24.16: `playwright install` hangs on Node 24.16+ (microsoft/playwright#40724).
          # Shared pin across the QTI repos; bump together with .nvmrc and the devcontainer.
          node-version: 24.15.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs for dry-run and for real. A stable release only comes from main, a prerelease only from
      # a branch in changesets pre mode (next); anything else would publish to the wrong dist-tag.
      - name: Check the release lane
        run: node tools/changesets/check-release-lane.mjs "${{ inputs.branch || 'main' }}"

      # Runs for dry-run and for real: this is the point where a missing umbrella bump turns
      # into a release that silently skips publishing @citolab/qti-components.
      - name: Check the umbrella is bumped with the workspace
        run: pnpm run changeset:check-umbrella

      - name: Dry-run release status
        if: ${{ inputs.dry_run }}
        run: |
          # README.md lives in .changeset/ but is not a changeset. `--since` names the branch being
          # released: without it changeset status runs `git merge-base main HEAD`, and a checkout of
          # next has no local main to compare against.
          if ls .changeset/*.md 2>/dev/null | grep -qv 'README\.md'; then
            pnpm exec changeset status --since="origin/${{ inputs.branch || 'main' }}"
          else
            echo "No pending changesets."
          fi

      - name: Dry-run version preview
        if: ${{ inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API,
          # so the preview needs the same token the real version step uses.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv 'README\.md'; then
            exit 0
          fi

          if [ -f .changeset/pre.json ]; then
            # `--snapshot` is refused in pre mode ("Snapshot release is not allowed in pre mode"), so
            # preview the real prerelease versioning (e.g. 10.0.0-next.1) instead.
            pnpm exec changeset version
          else
            pnpm exec changeset version --snapshot dryrun
          fi

          echo "Preview of version/changelog changes:"
          git --no-pager diff -- .changeset packages || true

          # Revert preview mutations; dry-run should not leave repository changes behind. Pre mode
          # also writes new files under .changeset/pre/, which checkout does not remove.
          git checkout -- .changeset packages
          git clean -fdq .changeset

      - name: Apply changeset versions
        id: version
        if: ${{ !inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run changeset:version

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets. Nothing to release."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit release version updates
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git add .changeset packages
          git commit -m "chore(release): changesets version [skip ci]"

      - name: Build workspace
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: pnpm run build

      - name: Configure npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: |
          # Remove any .npmrc that setup-node created (it contains _authToken placeholder
          # which overrides OIDC when set to empty/missing)
          rm -f .npmrc "$HOME/.npmrc"

          # Write a clean .npmrc — no _authToken so npm falls back to OIDC
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'provenance=true' > "$HOME/.npmrc"

      # `changeset publish` used to run here and crashed on every release: @changesets/cli 3.0.1
      # reads `response.info.versions` in getUnpublishedPackages without checking it exists, and its
      # pnpm code path can return a response that has no `versions` array. `pnpm -r publish` does the
      # job instead: it publishes every workspace package whose version is not yet on npm and skips
      # the rest, so a rerun after a partial release is safe. Tags come from `changeset:tag` below.
      #
      # On next, changesets is in pre mode and `.changeset/pre.json` names the dist-tag: publishing
      # without --tag would put a prerelease on `latest`.
      - name: Publish packages to npm
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          for var in $(env | grep -oP '^npm_config_\w+' | grep -vE '^npm_config_(registry|provenance|cache|userconfig)$'); do
            unset "$var"
          done
          tag=""
          if [ -f .changeset/pre.json ]; then
            tag="--tag $(node -p "require('./.changeset/pre.json').tag")"
          fi
          pnpm run ci:publish $tag
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_GIT_CHECKS: 'false'

      - name: Tag published packages
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: pnpm run changeset:tag

      # Push the commit and the tags as separate refspecs rather than relying on
      # `--follow-tags`. `changeset:tag` writes one tag per package (annotated, via
      # `git tag -a`), and pushing them explicitly keeps that independent of whatever
      # tag-following behaviour the commit push happens to have.
      - name: Push release commit and tags
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Create GitHub release for the umbrella package
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/qti-components/package.json').version")
          tag="@citolab/qti-components@${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          notes=$(node tools/changesets/release-notes.mjs "$version")
          flags=""
          # A prerelease (10.0.0-next.1) must not become the repository's "latest release".
          case "$version" in *-*) flags="--prerelease --latest=false" ;; esac
          gh release create "$tag" --title "@citolab/qti-components ${version}" --notes "$notes" $flags

      - name: Report release type
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry-run" > release-type.txt
          elif [ "${{ inputs.branch || 'main' }}" != "main" ]; then
            echo "prerelease" > release-type.txt
          else
            echo "real-release" > release-type.txt
          fi

      - name: Upload release type artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-type
          path: release-type.txt
          retention-days: 1
