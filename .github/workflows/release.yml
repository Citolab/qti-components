name: "Manual: release and publish packages (changesets)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Dry-run (no commits, tags, or publishes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs for dry-run and for real: this is the point where a missing umbrella bump turns
      # into a release that silently skips publishing @citolab/qti-components.
      - name: Check the umbrella is bumped with the workspace
        run: pnpm run changeset:check-umbrella

      - name: Dry-run release status
        if: ${{ inputs.dry_run }}
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            pnpm run changeset:status
          else
            echo "No pending changesets."
          fi

      - name: Dry-run version preview (snapshot)
        if: ${{ inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API,
          # so the preview needs the same token the real version step uses.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md >/dev/null 2>&1; then
            exit 0
          fi

          pnpm exec changeset version --snapshot dryrun

          echo "Preview of version/changelog changes:"
          git --no-pager diff -- .changeset packages || true

          # Revert preview mutations; dry-run should not leave repository changes behind.
          git checkout -- .changeset packages

      - name: Apply changeset versions
        id: version
        if: ${{ !inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run changeset:version

          # Keep generated manifests aligned with versioned sources in release commits.
          pnpm run cem

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets. Nothing to release."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit release version updates
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git add .changeset packages custom-elements.json
          git commit -m "chore(release): changesets version [skip ci]"

      - name: Build workspace
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: pnpm run build

      - name: Configure npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: |
          # Remove any .npmrc that setup-node created (it contains _authToken placeholder
          # which overrides OIDC when set to empty/missing)
          rm -f .npmrc "$HOME/.npmrc"

          # Write a clean .npmrc — no _authToken so npm falls back to OIDC
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'provenance=true' > "$HOME/.npmrc"

      # `changeset publish` used to run here, with continue-on-error, and it crashed on every
      # release: @changesets/cli 3.0.1 reads `response.info.versions` in getUnpublishedPackages
      # without checking it exists, and its pnpm code path can return a response that has no
      # `versions` array (the first `pnpm info <name>` lookup fails — a registry hiccup or rate
      # limit across ~34 packages is enough — and the `<name>@<version>` fallback it falls back
      # to is marked published regardless of shape).
      #
      # It was also redundant. The step below already publishes every package through
      # tools/publish-if-needed.mjs, which is idempotent and skips versions already on npm, and
      # tags come from `changeset:tag` further down. Nothing is lost by not running it: this repo
      # is not in changesets pre-release mode, so there are no dist-tags for it to get right, and
      # prereleases go through pkg-pr-new in a separate workflow.
      - name: Publish packages to npm
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          for var in $(env | grep -oP '^npm_config_\w+' | grep -vE '^npm_config_(registry|provenance|cache|userconfig)$'); do
            unset "$var"
          done
          pnpm run ci:publish:missing
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_GIT_CHECKS: 'false'

      - name: Tag published packages
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: pnpm run changeset:tag

      # Push the commit and the tags as separate refspecs rather than relying on
      # `--follow-tags`. `changeset:tag` writes one tag per package (annotated, via
      # `git tag -a`), and pushing them explicitly keeps that independent of whatever
      # tag-following behaviour the commit push happens to have.
      - name: Push release commit and tags
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Create GitHub release for the umbrella package
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/qti-components/package.json').version")
          tag="@citolab/qti-components@${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          notes=$(node tools/changesets/release-notes.mjs "$version")
          gh release create "$tag" --title "@citolab/qti-components ${version}" --notes "$notes"
