name: "CI: push-quality"

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI from'
        required: false
        default: 'main'
        type: string

# A newer push to the same PR makes the older run pointless. Never cancel runs on main or next:
# each push there is a commit someone may need a green result for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change that only touches docs, changesets, plans or workflows CI cannot test skips the heavy
  # jobs. The `ci` job below still reports, so the required check is satisfied. That holds for pull
  # requests and for the push that follows a merge, so a docs or chore merge finishes in seconds
  # instead of re-running a 4-minute pipeline. A push that changes code always runs in full: it is
  # the safety net for two PRs that were green alone and break each other. `ci.yml` and
  # `.github/actions/` are code on purpose: only a full run tests an edit to CI itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Does this change touch more than docs and workflows CI cannot test?
        id: diff
        run: |
          # Manual runs always run everything; so does a push we cannot diff (a new branch).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD^1 >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Pull request: HEAD is the merge commit, its first parent is the base branch.
          # Push: HEAD is the merged commit, its first parent is the branch as it was before.
          other=$(git diff --name-only HEAD^1 HEAD \
            | grep -vE '^(plans/|docs/|\.changeset/)|\.md$' \
            | grep -vE '^\.github/(workflows/(release|deploy-site|pr-preview)\.yml|skills/|ISSUE_TEMPLATE/)' \
            || true)
          if [ -n "$other" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs and untestable workflow changes only: heavy jobs skipped."
          fi

  # Static checks: cheap, and the fastest feedback on a typo.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `github.ref`, not 'main'. `inputs` is empty on anything but workflow_dispatch, so the
          # fallback is what every pull_request and push actually used. On pull_request
          # `github.ref` is refs/pull/N/merge, so this tests the merge result, which is the thing
          # being asked about. (A literal 'main' here once made every PR test main, never its own
          # code: run 33399522449.) workflow_dispatch still gets its branch input.
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint

      - name: Circular dependencies
        run: pnpm run madge

  # The published surface: build, then check what was built.
  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `github.ref`, not 'main'. `inputs` is empty on anything but workflow_dispatch, so the
          # fallback is what every pull_request and push actually used. On pull_request
          # `github.ref` is refs/pull/N/merge, so this tests the merge result, which is the thing
          # being asked about. (A literal 'main' here once made every PR test main, never its own
          # code: run 33399522449.) workflow_dispatch still gets its branch input.
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: publint
        run: pnpm run publint

      - name: attw
        run: pnpm run attw

      - name: Consumer types
        run: pnpm run consumer-types

  # Tests are the slow part (several minutes of browser stories), so they are sharded: the test
  # files are split into 3 groups that run on 3 machines at once. Each shard builds first, as the
  # sequential lane did.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Without a bound, a hung browser/test process (e.g. a story stuck on an unreachable external
    # fetch) runs until the runner itself is recycled, tens of minutes later, and surfaces only as
    # "The operation was canceled" instead of a clear timeout (run 36547613496).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `github.ref`, not 'main'. `inputs` is empty on anything but workflow_dispatch, so the
          # fallback is what every pull_request and push actually used. On pull_request
          # `github.ref` is refs/pull/N/merge, so this tests the merge result, which is the thing
          # being asked about. (A literal 'main' here once made every PR test main, never its own
          # code: run 33399522449.) workflow_dispatch still gets its branch input.
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Test (shard ${{ matrix.shard }}/3)
        run: |
          node tools/testing/pretest-clean.mjs
          pnpm exec vitest run --shard=${{ matrix.shard }}/3

  # The one check branch protection requires. It stays named `ci`, whatever the jobs above are.
  ci:
    needs: [changes, static, package, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi

  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        run: |
          if pnpm exec changeset status --since=origin/${{ github.base_ref || 'main' }}; then
            echo "✅ Changeset found."
          else
            echo "⚠️ No changeset found. If this PR changes published package behavior, a maintainer will add one before merging."
            echo "You can optionally add one yourself with: pnpm run changeset"
          fi

      # Hard failure, unlike the advisory step above: an unbumped umbrella is not a stale
      # version number, it is a package that never gets published at all. See the header of
      # tools/changesets/check-umbrella-bump.mjs.
      - name: Check the umbrella is bumped with the workspace
        run: pnpm run changeset:check-umbrella
