name: "CI: push-quality"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI from'
        required: false
        default: 'main'
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `github.ref`, not 'main'. `inputs` is empty on anything but workflow_dispatch, so the
          # fallback is what every pull_request and push actually used — and it was the literal
          # string 'main'. This job therefore tested main on every PR, never the PR's own code:
          # run 33399522449 reported main's 1166 tests against a head SHA whose branch has 1169,
          # and failed on an assertion the branch fixes.
          #
          # A green check was worth nothing either, which is the more dangerous half: a broken main
          # at least made it visible. On pull_request `github.ref` is refs/pull/N/merge, so this
          # tests the merge result, which is the thing being asked about. workflow_dispatch still
          # gets its branch input.
          ref: ${{ inputs.branch || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Pinned below 24.16: `playwright install` hangs after the browser
          # download completes (silent extraction-worker death) on Node 24.16+.
          # See microsoft/playwright#40724. Bump once that's resolved upstream.
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: |
          echo "🎭 Installing Playwright browsers..."
          npx playwright install --with-deps

      - name: Run ci:push-quality lane
        run: pnpm run ci:push-quality

  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        run: |
          if pnpm dlx @changesets/cli status --since=origin/main; then
            echo "✅ Changeset found."
          else
            echo "⚠️ No changeset found. If this PR changes published package behavior, a maintainer will add one before merging."
            echo "You can optionally add one yourself with: pnpm run changeset"
          fi
