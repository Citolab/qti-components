name: Storybook Deployment

on:
  # Auto-deploy the site after a successful release. workflow_run is immune to
  # the release commit's `[skip ci]`, unlike a tag-push trigger would be.
  workflow_run:
    workflows: ["Manual: release and publish packages (changesets)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v1.2.3). Leave empty for latest commit on selected branch.'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual runs always deploy; release-triggered runs deploy only if the release succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # dispatch: the given tag. release: latest main (incl. the version-bump commit). else: default ref.
          ref: ${{ inputs.tag || (github.event_name == 'workflow_run' && 'main') || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Build project 🔨
        run: pnpm run build

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
