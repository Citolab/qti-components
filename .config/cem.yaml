# @pwrs/cem — interactions-only manifest.
#
# Scope: packages/interactions only. This manifest is consumed by the QTI MCP
# server to generate QTI interaction markup, so it needs tag names and the QTI
# attribute contract — nothing else. `pnpm run cem:interactions` runs this and
# then strips the output down to elements + attributes.
#
# The wc-toolkit pipeline (cem.config.mjs) still produces the full
# custom-elements.json for Storybook and JSX types. The two are independent.
generate:
  # Element definitions only. Widening these to `src/**/*.ts` pulls in mixins, utils and
  # context modules that contribute nothing to the manifest and roughly triples runtime.
  files:
    - 'packages/interactions/*/src/qti-*.ts'
    - 'packages/interactions/core/src/elements/*/qti-*.ts'
  exclude:
    - '**/*.stories.ts'
    - '**/*.spec.ts'
    - '**/*.styles.ts'
    - '**/dist/**'
  output: 'custom-elements.interactions.raw.json'
