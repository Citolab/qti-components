<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 75" width="100" height="75">
  <!-- Rear wheel -->
  <circle cx="22" cy="52" r="18" fill="none" stroke="#2C3E50" stroke-width="4"/>
  <circle cx="22" cy="52" r="4" fill="#2C3E50"/>
  <!-- Front wheel -->
  <circle cx="78" cy="52" r="18" fill="none" stroke="#2C3E50" stroke-width="4"/>
  <circle cx="78" cy="52" r="4" fill="#2C3E50"/>
  <!-- Seat tube -->
  <line x1="47" y1="28" x2="47" y2="52" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="33" y1="28" x2="63" y2="28" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Down tube (headtube to BB) -->
  <line x1="63" y1="28" x2="47" y2="52" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="22" y1="52" x2="47" y2="52" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="22" y1="52" x2="47" y2="28" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="63" y1="28" x2="78" y2="52" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="68" y1="28" x2="68" y2="16" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <line x1="61" y1="16" x2="75" y2="16" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat post -->
  <line x1="47" y1="28" x2="44" y2="16" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="50" y2="16" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
</svg>
