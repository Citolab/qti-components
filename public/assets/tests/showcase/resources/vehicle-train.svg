<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 65" width="110" height="65">
  <!-- Train body -->
  <rect x="4" y="8" width="88" height="36" rx="6" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Nose (front) -->
  <path d="M92,8 L106,22 L106,36 L92,44 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Windows -->
  <rect x="10" y="14" width="18" height="14" rx="2" fill="#AED6F1" stroke="#C0392B" stroke-width="1"/>
  <rect x="36" y="14" width="18" height="14" rx="2" fill="#AED6F1" stroke="#C0392B" stroke-width="1"/>
  <rect x="62" y="14" width="18" height="14" rx="2" fill="#AED6F1" stroke="#C0392B" stroke-width="1"/>
  <!-- Stripe -->
  <rect x="4" y="32" width="88" height="6" fill="#C0392B"/>
  <!-- Pantograph (stroomafnemer) -->
  <line x1="30" y1="8" x2="30" y2="2" stroke="#888" stroke-width="2"/>
  <line x1="20" y1="2" x2="40" y2="2" stroke="#888" stroke-width="2"/>
  <!-- Rail -->
  <rect x="0" y="57" width="110" height="4" rx="1" fill="#888"/>
  <!-- Wheels -->
  <circle cx="22" cy="52" r="7" fill="#555" stroke="#333" stroke-width="1"/>
  <circle cx="50" cy="52" r="7" fill="#555" stroke="#333" stroke-width="1"/>
  <circle cx="78" cy="52" r="7" fill="#555" stroke="#333" stroke-width="1"/>
</svg>
