<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 65" width="100" height="65">
  <!-- Car body -->
  <rect x="6" y="26" width="82" height="20" rx="4" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1.5"/>
  <!-- Car roof -->
  <path d="M20,26 L30,12 L70,12 L80,26 Z" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1.5"/>
  <!-- Windscreen -->
  <path d="M32,25 L37,14 L63,14 L68,25 Z" fill="#AED6F1" stroke="#2C5F8A" stroke-width="1"/>
  <!-- Rear wheel -->
  <circle cx="26" cy="46" r="10" fill="#2C3E50" stroke="#555" stroke-width="1"/>
  <circle cx="26" cy="46" r="4" fill="#7F8C8D"/>
  <!-- Front wheel -->
  <circle cx="74" cy="46" r="10" fill="#2C3E50" stroke="#555" stroke-width="1"/>
  <circle cx="74" cy="46" r="4" fill="#7F8C8D"/>
  <!-- Headlight -->
  <rect x="86" y="30" width="7" height="6" rx="1" fill="#FFF176" stroke="#C9A227" stroke-width="1"/>
  <!-- Door line -->
  <line x1="50" y1="26" x2="50" y2="46" stroke="#2C5F8A" stroke-width="1"/>
</svg>
